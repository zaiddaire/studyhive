# Backup keep-alive for the free Render API (the primary pinger is a cron-job.org job, which runs on time;
# GitHub delays scheduled workflows, often to every ~30 minutes, so this alone can't keep Render awake).
#
# Render free services sleep after ~15 minutes without traffic, and all free services in a workspace share
# 750 instance hours a month. StudyHive is kept awake only from 07:00 to 23:59 IST (~530 hours/month); outside
# that window it sleeps and the site shows a "Waking up" notice on the first visit.
# Schedules are in UTC (IST = UTC+5:30). Scheduled workflows are free on public repositories; GitHub pauses
# them after 60 days without repository activity.
name: Keep API awake

on:
  schedule:
    - cron: "30-59/10 1 * * *"   # 07:00-07:59 IST
    - cron: "*/10 2-17 * * *"    # 07:30-23:29 IST
    - cron: "0-29/10 18 * * *"   # 23:30-23:59 IST
  workflow_dispatch:

env:
  API_URL: https://studyhive-api-lmsy.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API (waits through a cold start if needed)
        run: |
          if [[ "$API_URL" == *YOUR-API-SERVICE* ]]; then
            echo "API_URL not configured yet - skipping."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API_URL/actuator/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "API did not respond with 200" && exit 1

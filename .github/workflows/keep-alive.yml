# Keeps the free Render API (and the Aiven database behind it) awake so visitors never hit a cold start.
# Render free services sleep after ~15 minutes without traffic.
# Scheduled workflows are free on public repositories. GitHub pauses them after 60 days without repository
# activity - push a commit or run the workflow manually to re-enable.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  API_URL: https://studyhive-api-lmsy.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API (waits through a cold start if needed)
        run: |
          if [[ "$API_URL" == *YOUR-API-SERVICE* ]]; then
            echo "API_URL not configured yet - skipping."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$API_URL/actuator/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "API did not respond with 200" && exit 1

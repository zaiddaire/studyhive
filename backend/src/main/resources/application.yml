spring:
  application:
    name: studyhive-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studyhive}?sslMode=${DB_SSL_MODE:PREFERRED}&trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL:}&trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}}
    username: ${DB_USERNAME:studyhive}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # No hibernate.jdbc.time_zone: booking times are facility-local wall-clock values (LocalDateTime/LocalTime)
        # and must be stored exactly as given. Audit Instants are stored as UTC by Hibernate's TIMESTAMP_UTC type.
        format_sql: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
    baseline-on-migrate: false
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
    timeout: ${SESSION_TIMEOUT:7d}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        name: STUDYHIVE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  frontend-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-base-url: ${PUBLIC_APP_URL:http://localhost:5173}
  max-request-bytes: 65536
  security:
    max-login-attempts: 5
    lockout-minutes: 15
    csrf-cookie-secure: ${COOKIE_SECURE:false}
    csrf-cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    full-name: ${ADMIN_BOOTSTRAP_NAME:StudyHive Administrator}

logging:
  level:
    root: INFO
    com.studyhive: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
